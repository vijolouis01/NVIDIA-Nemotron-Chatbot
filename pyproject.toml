[project]
name = "nvidia-nemotron-chatbot"
version = "0.1.0"
description = "A simple AI chatbot built with Python and the NVIDIA Nemotron API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]
